<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>
    
    <h1>Trabalhando com Tabelas</h1>

    <table border="1">
        <tr> <!--Table row - São as linhas-->
            <th>Nome</th> <!--Table header - São os cabeçalhos da tabela-->
            <th>Idade</th>
            <th>Estado</th>
        </tr>

        <tr>
            <td>João</td> <!-- Table data-->
            <td>29</td>
            <td>SP</td>
        </tr>

        <tr>
            <td>Maria</td> <!-- Table data-->
            <td>02</td>
            <td>MG</td>
        </tr>
    </table>

</body>
</html>
