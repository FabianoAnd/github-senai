<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
    <style>
        .tamanho {
            font-size: 20px;
        }
    </style>
</head>

<body>
 <div class="tamanho">
    <h1>Trabalhando com listas </h1>

    <h2>Listas ordenadas</h2>

   
        <ol type="1" start="5"> <!--a ordem importa -->
            <li>Acordar</li>
            <li>Escovar os dentes</li>
            <li>Tomar café</li>
            <li>Trocar de roupa</li>
            <li>ir para o trabalho</li>
        </ol>
   
    <h2>Listas não ordenadas</h2> <!--a ordem NAO importa -->

    <ul type="disk">
        <li>Café</li>
        <li>Açucar</li>
        <li>Arroz</li>
        <li>Leite</li>
        <li>Macarrão</li>
        <li>Suco</li>
    </ul>
 </div>



</body>

</html>
