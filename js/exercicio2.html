<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        form {
            background-color: rgb(127, 212, 252);
            width: 300px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px 0 rgb(4, 176, 255);
        }

        #titulo {
            text-align: center;
            padding: 20px;
            margin-bottom: 10px;
        }

        input {
            margin-bottom: 10%;
            padding: 5px 90px 5px 0;
            border-radius: 15px;
            border: 5px;

        }

        #email {
            padding-left: 5px;
        }

        #senha {
            padding-left: 5px;
        }


        #botao {
            padding: 10px 115px 10px 115px;
            background-color: rgb(43, 164, 245);
            color: white;
            cursor: pointer;
            border: none;
            display: block;


        }

        #botao:hover {
            background-color: rgb(33, 134, 201);

        }

        label {
            display: block;
        }
    </style>
</head>

<body>

    <form id="formulario">
        <h1 id="titulo">Login</h1>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email" placeholder="Example@gmail.com" required>

        <label for="senha">Senha:</label>
        <input type="password" name="senha" id="senha" required>

        <input type="submit" value="Login" id="botao">
    </form>



    <script>

        let senhaCorreta = 12345
        let emailCorreto = "teste@gmail.com"
        let form = document.getElementById('formulario')
    
           
         

            form.addEventListener('submit', function (event) {
                event.preventDefault()
                console.log("O FORM FOI ENVIADO!")

            let email = document.getElementById('email').value
            let senha = Number(document.getElementById('senha').value)


                if (email === emailCorreto && senha === senhaCorreta) {
                    alert(`seu formulario foi enviado com sucesso!`)
                    window.location.href = 'logada.html'
                }

                else {
                    alert(`dados incorretos`)
                }

             }
            )







    </script>
</body>

</html>
