<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos de caixa</title>
    <style>

        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        h1{
            background-color: aqua;
            width: 300px;
            height: 200px;
            border: 12px solid black;
            padding: 20px;
            margin: 40px;

           /* padding: 10px 20px 30px 40px; */
            padding: 20px 50px; 
        }

    </style>
</head>

<body>

    <h1>Trabalhando com modelo de caixa</h1>

    <h2>Este é um h2</h2>

    <p>este é um paragrafo <span>este é um span</span></p>
    <p>este é um paragrafo <div>este é um span</div></p>

</body>

</html>
