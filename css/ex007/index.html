<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classe</title>
    <style>
        div {
            background-color: blueviolet;
            width: 200px;
            height: 200px;
            text-align: center;
            margin: 10px;
        }


        #box1:hover {
            background-color: green;
            font-size: 30px;

        }

        #box2:hover {
            background-color: rgb(221, 16, 9);
            font-size: 30px;
        }

        #box3:hover {
            background-color: rgb(10, 13, 231);
            font-size: 30px;
        }
    </style>
</head>

<body>
    <div id="box1">verde</div>
    <div id="box2">vermelho</div>
    <div id="box3">azul</div>
</body>

</html>
